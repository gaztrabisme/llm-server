services:
  # Production: Qwen3.5-35B-A3B Q4_K_M + fit-nobatch (~74 tok/s)
  llama-cpp:
    profiles: ["llama-cpp"]
    build:
      context: .
      dockerfile: docker/Dockerfile.llama-cpp
    image: llm-server/llama-cpp:latest-fit
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file: configs/llama-cpp-s006-e4-fit-nobatch.env
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # Vision: Q4_K_M + mmproj (requires latest-vision image built from b8177+)
  llama-cpp-vision:
    profiles: ["llama-cpp-vision"]
    image: llm-server/llama-cpp:latest-vision
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file: configs/llama-cpp-s007-e5-vision.env
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
